server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 5s
  max_block_bytes: 1000000
  max_block_duration: 1m

compactor:
  compaction:
    block_retention: 48h

metrics_generator:
  traces_storage:
    path: /var/tempo/traces-generator

  processor:
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.status_code
        - deployment.environment

    local_blocks:
      filter_server_spans: true

  storage:
    path: /var/tempo/metrics
    remote_write:
      - url: http://prometheus.klp.local:9090/api/v1/write
        send_exemplars: false

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, local-blocks]

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
