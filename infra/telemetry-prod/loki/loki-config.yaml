# 사용자 인증 활성화 여부
auth_enabled: false

# Loki 서버의 포트번호
server:
  http_listen_port: 3100
  log_level: error

# Loki 인스턴스의 주소
# NOTE: container 환경에서 다른 컨테이너/호스트에서 접근해야 하므로 0.0.0.0 유지
common:
  instance_addr: 0.0.0.0
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# 쿼리 범위에 대한 설정
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 30

# Loki의 스키마 설정
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: false

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  retention_period: 72h
  max_query_lookback: 72h
  # Required for OTLP logs ingest (/otlp) which carries resource attributes as structured metadata.
  allow_structured_metadata: true
