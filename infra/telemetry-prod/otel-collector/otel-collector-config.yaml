receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # 디버깅용 – Collector 로그에 span 찍기
  debug:
    verbosity: normal  # basic / normal / detailed

  otlphttp/tempo:
    endpoint: http://${env:TEMPO_HOST}:4318

  otlphttp/loki:
    endpoint: http://${env:LOKI_HOST}:3100/otlp

  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: klp_otel
    const_labels:
      component: otel-collector

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlphttp/tempo, debug ]

    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlphttp/loki, debug ]

    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ prometheus ]
