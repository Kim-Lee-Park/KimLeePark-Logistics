global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector-auth"
    static_configs:
      - targets:
          - "auth.klp.local:9464"

  - job_name: "otel-collector-user"
    static_configs:
      - targets:
          - "user.klp.local:9464"

  - job_name: "otel-collector-order"
    static_configs:
      - targets:
          - "order.klp.local:9464"

  - job_name: "otel-collector-hub"
    static_configs:
      - targets:
          - "hub.klp.local:9464"

  - job_name: "otel-collector-delivery"
    static_configs:
      - targets:
          - "delivery.klp.local:9464"

  - job_name: "otel-collector-notification"
    static_configs:
      - targets:
          - "notification.klp.local:9464"

  - job_name: "otel-collector-promotion"
    static_configs:
      - targets:
          - "promotion.klp.local:9464"

  - job_name: "otel-collector-gateway"
    static_configs:
      - targets:
          - "gateway.klp.local:9464"

  - job_name: "otel-collector-kafka"
    static_configs:
      - targets:
          - "kafka-otel.klp.local:9464"
