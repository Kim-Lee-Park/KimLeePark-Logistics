apiVersion: 1

deleteDatasources:
  # UI에서 만든 기존 데이터소스를 지워 UID 충돌 제거
  - name: Tempo
  - name: Prometheus
  - name: Loki

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo.klp.local:3200
    isDefault: false
    jsonData:
      tracesToLogs:
        datasourceUid: "loki"
      tracesToMetrics:
        datasourceUid: "prometheus"
      nodeGraph:
        enabled: true
      search:
        hide: false

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki.klp.local:3100
    isDefault: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: "traceID=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
