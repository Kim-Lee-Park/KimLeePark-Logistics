server:
  port: 8020

spring:
  application:
    name: order-service
  profiles:
    active: local
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 3
  kafka:
    bootstrap-servers: localhost:9092

