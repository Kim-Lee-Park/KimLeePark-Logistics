spring:
  datasource:
    url: jdbc:postgresql://localhost:5438/promotion
    username: kimleepark
    password: kimleepark
    driver-class-name: org.postgresql.Driver

  cloud:
    discovery:
      enabled: false         #eureka 비활성황
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
