services:
  postgres-auth:
    image: postgres:18
    container_name: postgres-auth-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: auth
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_auth_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - db-net

  postgres-user:
    image: postgres:18
    container_name: postgres-user-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: users
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_user_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - db-net

  postgres-hub:
    image: postgres:18
    container_name: postgres-hub-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: hub
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_hub_data:/var/lib/postgresql
    ports:
      - "5434:5432"
    networks:
      - db-net

  postgres-delivery:
    image: postgres:18
    container_name: postgres-delivery-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: delivery
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_delivery_data:/var/lib/postgresql
    ports:
      - "5435:5432"
    networks:
      - db-net

  postgres-order:
    image: postgres:18
    container_name: postgres-order-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: orders
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_order_data:/var/lib/postgresql
    ports:
      - "5436:5432"
    networks:
      - db-net

  postgres-notification:
    image: postgres:18
    container_name: postgres-notification-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: notification
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_notification_data:/var/lib/postgresql
    ports:
      - "5437:5432"
    networks:
      - db-net

  postgres-promotion:
    image: postgres:18
    container_name: postgres-promotion-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: promotion
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_promotion_data:/var/lib/postgresql
    ports:
      - "5438:5432"
    networks:
      - db-net

  postgres-payment:
    image: postgres:18
    container_name: postgres-payment-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: payment
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_payment_data:/var/lib/postgresql
    ports:
      - "5439:5432"
    networks:
      - db-net

  postgres-ai:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: postgres-ai-klp
    environment:
      POSTGRES_USER: kimleepark
      POSTGRES_PASSWORD: kimleepark
      POSTGRES_DB: ai
      TZ: Asia/Seoul
    volumes:
      - klp_postgres_ai_data:/var/lib/postgresql
      - ./init-sql/extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    ports:
      - "5440:5432"
    networks:
      - db-net

  redis:
    image: redis
    container_name: redis-klp
    volumes:
      - klp_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - db-net

  kafka:
    image: confluentinc/cp-kafka:8.1.1
    container_name: kafka-klp
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9093:9093"
      - "9404:9404"
      - "9999:9999"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      CLUSTER_ID: 'ugP2VOBGQ-CRY1OrnCY7fg'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx-exporter/jmx_prometheus_javaagent-0.20.0.jar=9404:/opt/jmx-exporter/kafka-jmx.yml
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: kafka
    volumes:
      - klp-kafka-data:/var/lib/kafka/data
      - ../telemetry/jmx:/opt/jmx-exporter:ro
    networks:
      - db-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui-klp
    depends_on:
      - kafka
    ports:
      - "8989:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: klp-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - db-net

networks:
  db-net:
    name: db-net

volumes:
  klp_postgres_auth_data:
  klp_postgres_user_data:
  klp_postgres_hub_data:
  klp_postgres_delivery_data:
  klp_postgres_order_data:
  klp_postgres_notification_data:
  klp_postgres_promotion_data:
  klp_postgres_payment_data:
  klp_postgres_ai_data:
  klp_redis_data:
  klp-kafka-data:
