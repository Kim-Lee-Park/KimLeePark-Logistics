version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: postgres-klp
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
  redis:
    image: redis
    container_name: redis-klp
    ports:
      - "6379:6379"
