spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: test-routes
              uri: http://localhost:8081
              predicates:
                - Path=/v1/test/**

eureka:
  client:
    enabled: false

jwt:
  access:
    secret: testSecretKeytestSecretKeytestSecretKey

gateway:
  auth:
    public-paths:
      - /v1/test/public