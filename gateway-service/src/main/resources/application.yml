server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-routes
              uri: lb://auth-service
              predicates:
                - Path=/v1/auth/**

            - id: user-routes
              uri: lb://user-service
              predicates:
                - Path=/v1/users/**

            - id: slack-routes
              uri: lb://notification-service
              predicates:
                - Path=/v1/slack/**

            - id: ai-routes
              uri: lb://notification-service
              predicates:
                - Path=/v1/ai/**

            - id: order-routes
              uri: lb://order-service
              predicates:
                - Path=/v1/orders/**

            - id: delivery-routes
              uri: lb://order-service
              predicates:
                - Path=/v1/deliveries/**

            - id: hub-routes
              uri: lb://hub-service
              predicates:
                - Path=/v1/hubs/**

            - id: inventory-routes
              uri: lb://hub-service
              predicates:
                - Path=/v1/inventories/**

            - id: product-routes
              uri: lb://hub-service
              predicates:
                - Path=/v1/products/**

            - id: company-routes
              uri: lb://hub-service
              predicates:
                - Path=/v1/companies/**

          discovery:
            locator:
              enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:=dG9hc3R5YWNjZXNzdG9rZW5zZWNyZXRrZXk=}

gateway:
  auth:
    public-paths:
      - /v1/auth/signup
      - /v1/auth/login
      - /v1/auth/check
      - /v1/companies
