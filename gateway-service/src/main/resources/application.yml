server:
  port: 8762

spring:
  application:
    name: gateway-service
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-routes
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: user-routes
              uri: lb://user-service
              predicates:
                - Path=/users/**

            - id: slack-routes
              uri: lb://user-service
              predicates:
                - Path=/slack/**

            - id: ai-routes
              uri: lb://user-service
              predicates:
                - Path=/ai/**

            - id: order-routes
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            - id: delivery-routes
              uri: lb://order-service
              predicates:
                - Path=/deliveries/**

            - id: hub-routes
              uri: lb://hub-service
              predicates:
                - Path=/hubs/**

            - id: inventory-routes
              uri: lb://hub-service
              predicates:
                - Path=/inventories/**

            - id: product-routes
              uri: lb://hub-service
              predicates:
                - Path=/products/**

          discovery:
            locator:
              enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}