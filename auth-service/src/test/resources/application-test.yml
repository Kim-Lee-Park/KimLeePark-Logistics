server:
  port: 8000

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: kimleepark
    password: kimleepark
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 500
            read-timeout: 500
            logger-level: full
          user-service:
            url: http://localhost:${wiremock.server.port}

jwt:
  access:
    secret: testaccesssecrettestaccesssecrettestaccesssecret
    expiration: 600000
  refresh:
    secret: testrefreshsecrettestrefreshsecrettestrefreshsecret
    expiration: 600000

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false