server:
  port: ${AUTH_SERVICE_PORT:8000}

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 3

springdoc:
  server-url: ${SERVER_URL:http://localhost:8080}
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui
