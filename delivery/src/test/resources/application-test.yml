spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: kimleepark
    password: kimleepark
    driver-class-name: org.postgresql.Driver

  cloud:
    discovery:
      enabled: false         #eureka 비활성황
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: delivery_schema
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

